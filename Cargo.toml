[package]
name = "windows-board"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows-first board plugin for Herdr"

[[bin]]
name = "windows-board"
path = "src/main.rs"

[dependencies]
# Argument parsing
clap = { version = "4", features = ["derive"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local state (data directory resolution)
directories = "5"
# Terminal UI
ratatui = "0.28"
crossterm = "0.28"
# Errors
anyhow = "1"

[profile.release]
strip = true